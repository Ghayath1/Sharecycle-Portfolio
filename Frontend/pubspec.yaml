name: sharecycleapp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^13.0.0
  provider: ^6.1.2
  webview_flutter: ^4.7.0

  # Maps + Location
  google_maps_flutter: ^2.9.0
  geolocator: ^12.0.0
  geocoding: ^2.1.1

  # Config + Networking + Storage
  flutter_dotenv: ^5.1.0
  http: ^1.2.2
  shared_preferences: ^2.2.3

  # Media upload
  image_picker: ^1.1.2
  mime: ^1.0.5
  http_parser: ^4.0.2

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0

  # Chat Features
  web_socket_channel: ^2.4.0
  firebase_messaging: ^14.7.10
  uuid: ^4.2.2
  stomp_dart_client: ^3.0.1
  get_storage: ^2.1.1
  firebase_core: ^2.32.0
  device_info_plus: ^9.0.0
  flutter_local_notifications: ^19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/     # ← includes login_bike.png, bike.png, profile.jpg, avatar1.jpg, ...
    - .env.dev



